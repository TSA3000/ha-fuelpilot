name: Release zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build zip
        run: cd custom_components/fuelpilot && zip -r ../../fuelpilot.zip . -x '__pycache__/*'
      - name: Upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" fuelpilot.zip --clobber
